<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Osakesijoittamisen tunnusluvut selkokielellä: mitä luku kertoo, onko suuri vai pieni arvo hyvä ja mitä katsoa rinnalla."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Osakkeen tunnusluvut</title>
    <script>
      // Tallennettu teema ennen ensimmäistä piirtoa, ettei sivu välähdä väärän värisenä (useTheme.ts).
      try {
        var theme = localStorage.getItem("tunnusluvut.teema");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
